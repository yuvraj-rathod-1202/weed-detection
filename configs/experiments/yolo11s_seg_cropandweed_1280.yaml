# Exp 4: yolo11s_seg_cropandweed at a higher image size (1024 -> 1280). Everything else unchanged.
# Why: in exp 3, weeds <= 24 px (~1 cm) were hit only ~60 % of the time and caused about half of all
# misses (notebooks/03_results_analysis.ipynb). At 1024 they are ~10 px wide at the network input; at 1280 ~13 px.
# Cost: ~1.56x compute per epoch (exp 3: ~3.3 min/epoch on 2 T4s -> expect ~5 min, ~6-7 h for 72-80 epochs).
# One file = one experiment. Outputs go to <output_root>/<name>/ and are resumed if they exist.

name: yolo11s_seg_cropandweed_1280
description: YOLO11s-seg fine-tuned on CropAndWeed (CropOrWeed2) at imgsz 1280 (exp 3 used 1024); laser target = one point per predicted weed mask, vetoed near predicted crops.
seed: 42
output_root: experiments

dataset: configs/datasets/cropandweed.yaml   # same prepared data (and split) as exp 3

model:
  weights: models/weights/yolo11s-seg.pt   # official ultralytics names are auto-downloaded to this path

# Passed as-is to ultralytics YOLO.train(): https://docs.ultralytics.com/modes/train/#train-settings
train:
  epochs: 80
  imgsz: 1280                     # the only change vs exp 3 (1024)
  batch: 6                        # 1.56x the pixels of exp 3's 8/GPU; use 12 with both T4s (6 per GPU)
  patience: 20                    # early stopping
  save_period: 10
  workers: 4
  device: null                    # null = auto; 0 = first GPU; [0, 1] = both Kaggle T4s; cpu

eval:
  split: test
  imgsz: 1280                     # same as training
  conf: 0.25
  iou: 0.7
  match_iou: 0.5
  max_images: null
  num_visualizations: 20

targeting:
  methods: [center_weighted_dt, distance_transform, centroid, skeleton, box_center]
  crop_classes: [Crop]            # never shot at; feed the safety gate and crop_hit_rate
  crop_margin_px: 20              # ~8 mm at ~0.4 mm/px (1.1 m height, 50 mm lens): laser spot radius + aiming error
