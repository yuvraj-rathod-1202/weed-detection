name: yolo11s_seg
description: YOLO11s-seg fine-tuned on CottonWeedDet12; laser target = one point per
  predicted weed mask.
seed: 42
output_root: experiments
dataset:
  name: cottonweeddet12
  region: non_indian
  raw_dir: data/raw/cottonweeddet12
  prepared_dir: data/processed/cottonweeddet12_seg
  label_fixes: data/label_fixes/cottonweeddet12.csv
  split:
    train: 0.65
    val: 0.2
    test: 0.15
  split_seed: 42
  max_images: null
  sam_model: models/weights/sam2.1_b.pt
model:
  weights: models/weights/yolo11s-seg.pt
train:
  epochs: 100
  imgsz: 640
  batch: 16
  patience: 20
  save_period: 10
  workers: 4
  device: null
eval:
  split: test
  imgsz: 640
  conf: 0.25
  iou: 0.7
  match_iou: 0.5
  max_images: null
  num_visualizations: 20
targeting:
  methods:
  - center_weighted_dt
  - distance_transform
  - centroid
  - skeleton
  - box_center
config_file: configs/experiments/yolo11s_seg.yaml
